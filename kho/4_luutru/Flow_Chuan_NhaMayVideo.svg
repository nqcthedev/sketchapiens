<svg viewBox="0 0 900 1200" width="900" height="1200" xmlns="http://www.w3.org/2000/svg">
<style>
  text{font-family:'DejaVu Sans','Arial',sans-serif;}
  .h1{fill:#1A1A1A;font-weight:700;}
  .sub{fill:#555555;}
  .name{fill:#1A1A1A;font-weight:700;}
  .tool{fill:#666666;}
  .box{fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5;}
  .boxh{fill:#FFFFFF;stroke:#2D5FBF;stroke-width:2;}
  .numc{fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5;}
  .num{fill:#1A1A1A;font-weight:700;}
  .badge{fill:#666666;font-weight:600;}
  .badgeh{fill:#2D5FBF;font-weight:700;}
  .arrow{stroke:#CBD2D9;stroke-width:2;}
  .accent{fill:#2D5FBF;}
  .div{stroke:#E5E8EB;stroke-width:1;}
</style>
<rect x="0" y="0" width="900" height="1200" fill="#FFFFFF"/>

<text class="h1" x="40" y="50" font-size="29">NHÀ MÁY VIDEO TỰ ĐỘNG — FLOW CHUẨN</text>
<text class="sub" x="40" y="80" font-size="16">Người Que Cổ Đại · bán tự động: ~80% AUTO + 3 chốt người · chạy theo lô</text>
<line class="div" x1="40" y1="98" x2="860" y2="98"/>

<rect class="box" x="40" y="116" width="16" height="16" rx="3"/>
<text class="sub" x="64" y="129" font-size="13.5">AUTO (máy chạy)</text>
<circle class="accent" cx="218" cy="124" r="8"/>
<text class="sub" x="234" y="129" font-size="13.5">Chốt NGƯỜI = MOAT (đề tài · kịch bản · packaging)</text>

<path class="arrow" d="M 786 176 H 802 V 1048 H 786" fill="none" stroke="#2D5FBF"/>
<text class="badgeh" x="824" y="612" font-size="14" transform="rotate(90 824 612)" text-anchor="middle">×3–4 KÊNH · CHẠY LÔ</text>

<!-- 1 -->
<rect class="boxh" x="110" y="168" width="620" height="112" rx="14"/>
<rect class="accent" x="110" y="168" width="7" height="112" rx="3"/>
<circle class="numc" cx="70" cy="224" r="24"/><text class="num" x="70" y="232" font-size="22" text-anchor="middle">1</text>
<text class="name" x="140" y="206" font-size="21">RESEARCH</text>
<text class="sub" x="140" y="234" font-size="15">Soi outlier → chọn đề tài</text>
<text class="tool" x="140" y="258" font-size="12.5">YouTube data · topic-finder · sổ tay 5 cổng</text>
<text class="badgeh" x="712" y="196" font-size="13" text-anchor="end">AUTO + NGƯỜI</text>
<line class="arrow" x1="420" y1="280" x2="420" y2="292"/><path class="accent" d="M414 292 L426 292 L420 300 Z"/>

<!-- 2 -->
<rect class="boxh" x="110" y="296" width="620" height="112" rx="14"/>
<rect class="accent" x="110" y="296" width="7" height="112" rx="3"/>
<circle class="numc" cx="70" cy="352" r="24"/><text class="num" x="70" y="360" font-size="22" text-anchor="middle">2</text>
<text class="name" x="140" y="334" font-size="21">SCRIPT</text>
<text class="sub" x="140" y="362" font-size="15">Skill viết → bạn tinh chỉnh</text>
<text class="tool" x="140" y="386" font-size="12.5">skill viet-kich-ban · fact-check (retention = moat)</text>
<text class="badgeh" x="712" y="324" font-size="13" text-anchor="end">AUTO + NGƯỜI</text>
<line class="arrow" x1="420" y1="408" x2="420" y2="420"/><path class="accent" d="M414 420 L426 420 L420 428 Z"/>

<!-- 3 -->
<rect class="box" x="110" y="424" width="620" height="112" rx="14"/>
<circle class="numc" cx="70" cy="480" r="24"/><text class="num" x="70" y="488" font-size="22" text-anchor="middle">3</text>
<text class="name" x="140" y="462" font-size="21">VOICE</text>
<text class="sub" x="140" y="490" font-size="15">Đọc + timestamp tự động</text>
<text class="tool" x="140" y="514" font-size="12.5">ElevenLabs API (with-timestamps) → bỏ bước dán tay</text>
<text class="badge" x="712" y="452" font-size="13" text-anchor="end">AUTO</text>
<line class="arrow" x1="420" y1="536" x2="420" y2="548"/><path class="accent" d="M414 548 L426 548 L420 556 Z"/>

<!-- 4 -->
<rect class="box" x="110" y="552" width="620" height="112" rx="14"/>
<circle class="numc" cx="70" cy="608" r="24"/><text class="num" x="70" y="616" font-size="22" text-anchor="middle">4</text>
<text class="name" x="140" y="590" font-size="21">PROMPTS</text>
<text class="sub" x="140" y="618" font-size="15">1 prompt mỗi câu</text>
<text class="tool" x="140" y="642" font-size="12.5">LLM + Art Bible (doodle màu + nền theo cảm xúc)</text>
<text class="badge" x="712" y="580" font-size="13" text-anchor="end">AUTO</text>
<line class="arrow" x1="420" y1="664" x2="420" y2="676"/><path class="accent" d="M414 676 L426 676 L420 684 Z"/>

<!-- 5 -->
<rect class="box" x="110" y="680" width="620" height="112" rx="14"/>
<circle class="numc" cx="70" cy="736" r="24"/><text class="num" x="70" y="744" font-size="22" text-anchor="middle">5</text>
<text class="name" x="140" y="718" font-size="21">IMAGES  ★</text>
<text class="sub" x="140" y="746" font-size="15">API + character-ref + seed</text>
<text class="tool" x="140" y="770" font-size="12.5">Flux / SDXL / DALL·E  (API > Google Flow để scale)</text>
<text class="badge" x="712" y="708" font-size="13" text-anchor="end">AUTO</text>
<line class="arrow" x1="420" y1="792" x2="420" y2="804"/><path class="accent" d="M414 804 L426 804 L420 812 Z"/>

<!-- 6 -->
<rect class="box" x="110" y="808" width="620" height="112" rx="14"/>
<circle class="numc" cx="70" cy="864" r="24"/><text class="num" x="70" y="872" font-size="22" text-anchor="middle">6</text>
<text class="name" x="140" y="846" font-size="21">ASSEMBLE</text>
<text class="sub" x="140" y="874" font-size="15">Sync + phụ đề + logo</text>
<text class="tool" x="140" y="898" font-size="12.5">ffmpeg / HyperFrames · chuyển cảnh, chạy chữ</text>
<text class="badge" x="712" y="836" font-size="13" text-anchor="end">AUTO</text>
<line class="arrow" x1="420" y1="920" x2="420" y2="932"/><path class="accent" d="M414 932 L426 932 L420 940 Z"/>

<!-- 7 -->
<rect class="boxh" x="110" y="936" width="620" height="112" rx="14"/>
<rect class="accent" x="110" y="936" width="7" height="112" rx="3"/>
<circle class="numc" cx="70" cy="992" r="24"/><text class="num" x="70" y="1000" font-size="22" text-anchor="middle">7</text>
<text class="name" x="140" y="974" font-size="21">PACKAGE</text>
<text class="sub" x="140" y="1002" font-size="15">Metadata + thumbnail → duyệt</text>
<text class="tool" x="140" y="1026" font-size="12.5">title · desc · tags · thumbnail → duyệt → upload</text>
<text class="badgeh" x="712" y="964" font-size="13" text-anchor="end">AUTO + NGƯỜI</text>

<line class="div" x1="40" y1="1078" x2="860" y2="1078"/>
<text class="h1" x="40" y="1104" font-size="15">2 QUYẾT ĐỊNH LÀM NÊN "TỐT NHẤT"</text>
<rect class="boxh" x="40" y="1116" width="405" height="40" rx="10"/>
<text class="sub" x="56" y="1141" font-size="13">★ Ảnh qua API (Flux/SDXL/DALL·E) > Google Flow để scale</text>
<rect class="boxh" x="455" y="1116" width="405" height="40" rx="10"/>
<text class="sub" x="471" y="1141" font-size="13">★ Nhất quán: character-ref + seed cố định (+ LoRA)</text>
<text class="sub" x="40" y="1184" font-size="13">Đừng zero-touch (kênh nhạt). Giữ tay người ở 3 chốt: đề tài · kịch bản · packaging.</text>
</svg>